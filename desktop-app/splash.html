<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Automatic Video Editor</title>
    <style>
      :root {
        font-family: Inter, Segoe UI, system-ui, sans-serif;
        color: #f4f0e8;
        background: #181713;
      }

      body {
        margin: 0;
        height: 100vh;
        display: grid;
        place-items: center;
        background: #181713;
      }

      main {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
      }

      .splash {
        width: 320px;
        display: grid;
        gap: 18px;
        justify-items: center;
      }

      img {
        width: 82px;
        height: 82px;
      }

      h1 {
        margin: 0;
        font-size: 22px;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: #b7afa2;
        font-size: 13px;
      }

      .bar {
        width: 220px;
        height: 8px;
        border: 1px solid #39352d;
        border-radius: 20px;
        overflow: hidden;
        background: #11100e;
      }

      .bar span {
        display: block;
        width: 55%;
        height: 100%;
        background: linear-gradient(90deg, #6db5a5, #ffd166);
        animation: load 1.2s ease-in-out infinite alternate;
      }

      @keyframes load {
        from { transform: translateX(-65%); }
        to { transform: translateX(145%); }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="splash">
        <img src="assets/icon.svg" alt="" />
        <h1>Automatic Video Editor</h1>
        <p>Starting workspace</p>
        <div class="bar"><span></span></div>
      </section>
    </main>
  </body>
</html>
